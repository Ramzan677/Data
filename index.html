<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simdata - Developed by Ramzan Ahsan</title>
    <meta name="description" content="Simdata Portal - Search Network Details">
    
    <!-- Tailwind CSS (Styling Framework) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CORE STYLES --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .result-area {
            animation: slideUp 0.5s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        
        /* --- LOADER --- */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- GLOW EFFECTS --- */
        .glow-title {
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px #fff, 0 0 10px #ffffff80;
            }
            to {
                text-shadow: 0 0 20px #fff, 0 0 30px #ffffffcc, 0 0 40px #ffffff80;
            }
        }

        .glow-subtitle {
             animation: glow-sub 2s ease-in-out infinite alternate;
        }

        @keyframes glow-sub {
             from {
                box-shadow: 0 0 5px rgba(255,255,255,0.2);
                text-shadow: 0 0 2px #fff;
            }
            to {
                box-shadow: 0 0 20px rgba(255,255,255,0.6);
                text-shadow: 0 0 8px #fff;
            }
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="w-full p-6 text-center text-white relative z-10">
        <h1 class="text-5xl font-bold mb-4 tracking-tight glow-title">Simdata Portal</h1>
        <p class="text-xl font-light tracking-wider bg-black/20 inline-block px-4 py-1 rounded-full backdrop-blur-sm glow-subtitle">
            Developed by Ramzan Ahsan
        </p>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4 w-full">
        <!-- Main Card -->
        <div class="glass-panel w-full max-w-7xl rounded-3xl p-6 md:p-8 transform transition-all duration-300">
            
            <!-- Search Input Area -->
            <div class="mb-8 max-w-xl mx-auto">
                <label for="phoneNumber" class="block text-gray-700 text-sm font-bold mb-2 ml-1">
                    Enter Mobile Number or CNIC
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                    <input type="number" id="phoneNumber" 
                        class="w-full pl-10 pr-4 py-3 rounded-xl border-2 border-gray-200 focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-200 transition-all bg-gray-50 text-lg placeholder-gray-400" 
                        placeholder="03001234567 or 35202..."
                    >
                </div>
                
                <button onclick="fetchData()" class="w-full mt-4 bg-gradient-to-r from-purple-600 to-blue-500 text-white font-bold py-3 px-6 rounded-xl hover:shadow-lg hover:from-purple-700 hover:to-blue-600 transform active:scale-95 transition-all duration-200 flex justify-center items-center gap-2">
                    <i class="fas fa-database"></i> Get Data
                </button>
            </div>

            <!-- Loader -->
            <div id="loader" class="loader mb-4"></div>

            <!-- Error Message Box -->
            <div id="errorMsg" class="hidden max-w-xl mx-auto bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded mb-4 animate-pulse">
                <p class="font-bold">Error</p>
                <p id="errorText">Please enter a valid input.</p>
            </div>

            <!-- Results Section (Hidden by default) -->
            <div id="resultArea" class="hidden result-area">
                <div class="bg-white rounded-2xl shadow-inner p-4 md:p-6 border border-gray-100 relative overflow-hidden flex flex-col">
                    
                    <h3 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b flex items-center gap-2">
                        <i class="fas fa-table text-purple-600"></i> Search Results
                    </h3>
                    
                    <!-- Data Table -->
                    <div id="dataContent" class="w-full"></div>

                    <!-- Watermark -->
                    <div class="mt-6 pt-4 border-t border-dashed border-gray-300 text-center">
                        <span class="text-xs font-bold text-purple-600 uppercase tracking-widest bg-purple-50 px-3 py-1 rounded-full">
                            <i class="fas fa-check-circle"></i> Data Credit by Ramzan Ahsan
                        </span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black/30 backdrop-blur-md text-white py-6 mt-auto">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-sm opacity-80">
                &copy; 2024 Simdata. All rights reserved.
            </div>
            
            <a href="https://chat.whatsapp.com/LoafyPWMGOv88oElxdwOB8" target="_blank" class="group flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-full font-semibold transition-all shadow-lg hover:shadow-green-500/30">
                <i class="fab fa-whatsapp text-xl group-hover:animate-bounce"></i>
                <span>Join Official WhatsApp Group</span>
            </a>
        </div>
    </footer>

    <!-- Application Logic -->
    <script>
        async function fetchData() {
            const input = document.getElementById('phoneNumber');
            const resultArea = document.getElementById('resultArea');
            const dataContent = document.getElementById('dataContent');
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            let number = input.value.trim();

            // 1. Reset UI
            resultArea.classList.add('hidden');
            errorMsg.classList.add('hidden');
            dataContent.innerHTML = ''; 
            
            // 2. Validation
            if (!number || number.length < 10) {
                errorText.innerText = "Please enter a valid Phone Number or CNIC.";
                errorMsg.classList.remove('hidden');
                return;
            }

            // 3. Formatting
            if (number.startsWith('0') && number.length === 11) {
                number = '92' + number.substring(1);
            } else if (number.startsWith('3') && number.length === 10) {
                number = '92' + number;
            }
            
            // 4. Loading State
            loader.style.display = 'block';

            // 5. API Request
            const apiBaseUrl = "https://sychosimdatabase.vercel.app/api/lookup/"; 

            try {
                const response = await fetch(`${apiBaseUrl}${number}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const apiResponse = await response.json();
                
                // 6. Data Parsing
                let records = [];

                // Handle various API structures
                if (apiResponse.results && Array.isArray(apiResponse.results)) {
                    records = apiResponse.results;
                } else if (Array.isArray(apiResponse)) {
                    records = apiResponse;
                } else if (apiResponse.data && Array.isArray(apiResponse.data)) {
                    records = apiResponse.data;
                } else if (apiResponse.data && typeof apiResponse.data === 'object') {
                    records = [apiResponse.data];
                } else if (typeof apiResponse === 'object') {
                    records = [apiResponse];
                }

                records = records.filter(r => r && typeof r === 'object' && !r.error);

                if (records.length === 0) {
                    throw new Error("No record found.");
                }

                // 7. Render Table
                let html = `
                    <div class="overflow-x-auto rounded-xl border border-gray-200 shadow-sm">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gradient-to-r from-purple-100 to-blue-50">
                                <tr>
                                    <th scope="col" class="px-4 py-4 text-left text-xs font-bold text-purple-700 uppercase tracking-wider">Mobile Number</th>
                                    <th scope="col" class="px-4 py-4 text-left text-xs font-bold text-purple-700 uppercase tracking-wider">Name</th>
                                    <th scope="col" class="px-4 py-4 text-left text-xs font-bold text-purple-700 uppercase tracking-wider">CNIC</th>
                                    <th scope="col" class="px-4 py-4 text-left text-xs font-bold text-purple-700 uppercase tracking-wider">Address</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                `;
                
                records.forEach((record, index) => {
                    // Smart Field Mapping
                    const fieldMap = {
                        number: 'N/A',
                        name: 'N/A',
                        cnic: 'N/A',
                        address: 'N/A'
                    };
                    
                    for (const [key, value] of Object.entries(record)) {
                        if (value === null || value === undefined || value === "") continue;
                        
                        const lowerKey = key.trim().toLowerCase();
                        const strValue = String(value).trim();
                        
                        if (lowerKey.match(/number|phone|mobile|cell|msisdn|contact/)) {
                            fieldMap.number = strValue;
                        } else if (lowerKey.match(/name|full|first|last|customer|subscriber|owner/)) {
                            fieldMap.name = strValue;
                        } else if (lowerKey.match(/cnic|identity|nic|id_card|idcard/)) {
                            fieldMap.cnic = strValue;
                        } else if (lowerKey.match(/address|city|location|area|residence|addr/)) {
                            fieldMap.address = strValue;
                        }
                    }

                    // Fallback Heuristics
                    if (fieldMap.number === 'N/A') {
                         for (const [key, value] of Object.entries(record)) {
                             if (String(value).match(/^(92|0)?3\d{9}$/)) {
                                 fieldMap.number = String(value);
                                 break;
                             }
                         }
                    }

                    html += `
                        <tr class="hover:bg-purple-50 transition-colors duration-150">
                            <td class="px-4 py-4 text-sm font-semibold text-gray-900 whitespace-nowrap border-l-4 border-transparent hover:border-purple-500">${fieldMap.number}</td>
                            <td class="px-4 py-4 text-sm text-gray-800 whitespace-nowrap font-medium">${fieldMap.name}</td>
                            <td class="px-4 py-4 text-sm text-gray-800 whitespace-nowrap bg-gray-50 font-mono">${fieldMap.cnic}</td>
                            <td class="px-4 py-4 text-sm text-gray-600 min-w-[200px] break-words">${fieldMap.address}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                dataContent.innerHTML = html;
                resultArea.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                errorText.innerText = error.message.includes("Failed to fetch") 
                    ? "Error: Could not connect to API." 
                    : error.message;
                errorMsg.classList.remove('hidden');
            } finally {
                loader.style.display = 'none';
            }
        }

        // Enter Key Support
        document.getElementById('phoneNumber').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                fetchData();
            }
        });
    </script>
</body>
</html>
